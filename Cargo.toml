[package]
name = "voxel-mesh-defense"
version = "0.1.0"
edition = "2021"

[dependencies]
# WASM対応済みの軽量2Dゲームライブラリ。Bevyの代替として採用。
macroquad = "0.4"
noise = "0.9.0"

# WASMターゲットでJavaScriptのrandom APIを使って乱数を生成する
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
