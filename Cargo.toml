[package]
name = "voxel-mesh-defense"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = "0.18.1"
bevy_mesh = "0.18.1"
noise = "0.9.0"
rand = "0.10.1"

# WASMターゲットでJavaScriptのrandom APIを使って乱数を生成する
# getrandom 0.4.x (rand 0.10 経由) はwasm_jsフィーチャーが必要
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }
console_error_panic_hook = "0.1.7"

# 開発用WASMビルドでも速度を確保するため最適化レベルを上げる
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
